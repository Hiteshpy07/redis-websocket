services:
  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - co-sketch-net

  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ./be/.env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - co-sketch-net

  frontend:
    build:
      context: ./fe/vite-project
      dockerfile: Dockerfile
    container_name: frontend-compose
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - co-sketch-net
volumes:
  redis-data:
networks:
  co-sketch-net:
    driver: bridge


